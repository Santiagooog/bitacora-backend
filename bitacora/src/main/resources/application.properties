spring.application.name=bitacora

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bitacora?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
spring.mvc.async.request-timeout=600000
app.initial-admin.password=${BITACORA_INITIAL_ADMIN_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
